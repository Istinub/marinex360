name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marinex
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: marinex360
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marinex -d marinex360"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      maildev:
        image: maildev/maildev
        ports:
          - 1025:1025

    env:
      DATABASE_URL: postgresql://marinex_app:localdev_app@localhost:5432/marinex360
      DIRECT_DATABASE_URL: postgresql://marinex:localdev@localhost:5432/marinex360
      SHADOW_DATABASE_URL: postgresql://marinex:localdev@localhost:5432/marinex360_shadow
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: ap-southeast-1
      S3_BUCKET: marinex360-ci
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Start MinIO
        # GH Actions' `services:` block can't override a container's start command, and
        # MinIO needs one (`server /data ...`) — same reason local docker-compose.yml
        # sets `command:` explicitly. Running it directly with `docker run` gives full
        # control and mirrors the local image/env/command exactly.
        run: |
          docker run -d --name minio-ci \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data --console-address ":9001"

      - name: Create shadow database
        run: PGPASSWORD=localdev psql -h localhost -U marinex -d marinex360 -c "CREATE DATABASE marinex360_shadow;" || true

      - name: Provision non-owner app role
        run: |
          PGPASSWORD=localdev psql -h localhost -U marinex -d marinex360 \
            -v app_password="'localdev_app'" \
            -f infra/postgres/provision-app-role.sql

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::MinIO did not become ready in time"
          docker logs minio-ci || true
          exit 1

      - name: Create MinIO bucket
        # aws-cli reads AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY specifically (NOT our
        # app's S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY names) — set inline here rather
        # than adding AWS_*-named vars to the job-level env, to avoid confusion with the
        # app's own S3_* convention. No `|| true`: this container is freshly started
        # every run, so the bucket can never already exist — a real failure here must
        # be loud, not swallowed, or it resurfaces later as a confusing NoSuchBucket
        # deep inside the test run instead of a clear failure at its actual source.
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        run: |
          aws --endpoint-url http://localhost:9000 s3 mb s3://marinex360-ci
          aws --endpoint-url http://localhost:9000 s3 ls | grep -q marinex360-ci \
            || { echo "::error::Bucket creation did not stick"; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Install Chrome for worker PDF tests
        # Ubuntu's `apt install chromium` is a snap-only stub with no real binary on
        # GitHub's runner (confirmed empirically — see D-038 handoff). Puppeteer's own
        # Chrome-for-Testing downloader sidesteps the Debian/Ubuntu packaging split
        # entirely. Independent of the Chromium baked into apps/worker/Dockerfile's
        # production image — doesn't need to match it byte-for-byte, just be a
        # compatible, runnable Chrome build.
        run: |
          npx puppeteer@23 browsers install chrome
          CHROME_BIN=$(find "$HOME/.cache/puppeteer/chrome" -maxdepth 3 -type f -name chrome | head -1)
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::Chrome binary not found after install"; exit 1
          fi
          "$CHROME_BIN" --version
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Verify Maildev SMTP is reachable
        run: |
          node -e '
            const net = require("node:net");
            const host = process.env.SMTP_HOST;
            const port = Number(process.env.SMTP_PORT);
            const socket = net.createConnection({ host, port });
            socket.setTimeout(5000);
            socket.once("connect", () => {
              console.log(`SMTP reachable at ${host}:${port}`);
              socket.end();
            });
            socket.once("timeout", () => {
              console.error(`SMTP connection timed out at ${host}:${port}`);
              socket.destroy();
              process.exitCode = 1;
            });
            socket.once("error", (error) => {
              console.error(`SMTP unreachable at ${host}:${port}: ${error.message}`);
              process.exitCode = 1;
            });
          '

      - name: Integration tests
        env:
          RUN_DB_TESTS: "1"
          RUN_WORKER_TESTS: "1"
        run: npm run test

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t marinex-api:ci .
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t marinex-worker:ci .
